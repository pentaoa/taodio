[package]
name = "taodio"
version = "0.2.0"
edition = "2024"
description = "A polished macOS terminal audio recorder."
readme = "README.md"
repository = "https://github.com/pentaoa/taodio"

[dependencies]
cpal = "0.16"
crossterm = "0.29"
hound = "3.5"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
